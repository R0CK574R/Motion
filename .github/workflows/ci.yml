name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  risk-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build
        run: |
          cmake -S . -B build -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build -j
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: API tests
        run: python -m pytest service/tests

  backend:
    runs-on: ubuntu-latest
    # The ledger's guarantees are enforced by database triggers, so the tests
    # run against a real Postgres rather than an in-memory stand-in.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
          POSTGRES_DB: motion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
