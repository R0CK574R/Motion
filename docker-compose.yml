services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_DB: motion
    ports:
      - "5432:5432"
    volumes:
      - motion_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion"]
      interval: 5s
      timeout: 5s
      retries: 10

  # C++ risk engine behind a small Python HTTP wrapper. Internal only: the
  # port is not published, so only the api service can reach it.
  risk:
    build: ./risk-engine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      risk:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://motion:motion@postgres:5432/motion
      RISK_ENGINE_URL: http://risk:8000

volumes:
  motion_pgdata:
